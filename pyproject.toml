[project]
name = "gbdt"
version = "0.1.0"
description = "Toy from-scratch GBDT implementation compared against LightGBM"
requires-python = ">=3.10"
dependencies = [
    "lightgbm>=4.7.0",
    "numpy>=2.2.6",
    "optuna>=5.0.0",
    "scikit-learn>=1.7.2",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
