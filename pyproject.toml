[project]
name = "gbdt"
version = "0.1.0"
description = "个人从零实现的 GBDT 回归器: 基于二阶泰勒展开的梯度提升树模型, 可用于在量化因子上训练预测模型"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lightgbm>=4.7.0",
    "numpy>=2.2.6",
    "optuna>=5.0.0",
    "scikit-learn>=1.7.2",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
